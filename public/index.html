<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木塞 - 潮汕两张半</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 大厅 -->
  <div id="lobby" class="screen active">
    <div class="lobby-container">
      <h1>木塞</h1>
      <p class="subtitle">潮汕两张半</p>
      <div class="lobby-form">
        <input type="text" id="playerName" placeholder="输入昵称" maxlength="8">
        <button id="btnCreate" class="btn btn-primary">创建房间</button>
        <div class="divider">或</div>
        <input type="text" id="roomIdInput" placeholder="输入房间号" maxlength="4">
        <button id="btnJoin" class="btn btn-secondary">加入房间</button>
      </div>
    </div>
  </div>

  <!-- 房间 -->
  <div id="room" class="screen">
    <div class="room-header">
      <span>房间号: <strong id="displayRoomId"></strong></span>
      <span id="gameStatus" class="status-badge">等待中</span>
    </div>
    <div id="playerList" class="player-list"></div>
    <div class="room-actions">
      <button id="btnAddAI" class="btn btn-outline">添加电脑</button>
      <button id="btnStart" class="btn btn-primary">开始游戏</button>
    </div>
  </div>

  <!-- 游戏牌桌 -->
  <div id="table" class="screen">
    <div class="table-header">
      <div class="table-header-left">
        <span>房间 <strong id="tableRoomId"></strong></span>
        <span id="tableRound" class="round-badge"></span>
      </div>
      <div class="table-header-right">
        <span id="tableStatus" class="status-badge"></span>
        <button id="btnLeave" class="btn btn-sm btn-danger">离开</button>
      </div>
    </div>
    <div id="scoreBoard" class="score-board"></div>
    <div id="oddsInfo" class="odds-info hidden">
      <span>等级: 双鬼＞天公9＞天公8＞豹子＞同花顺＞杂顺子＞其他拼点数(9~1点)＞零点(吃双鬼) | 倍率: 同花天公2x 同花2张/对子2x 同花3张3x 杂顺子4x 同花顺6x 豹子8x 双鬼10x</span>
    </div>
    <div id="revealArea" class="reveal-area"></div>
    <div id="phaseBanner" class="phase-banner hidden"></div>
    <div id="gameTable" class="game-table"></div>
    <div id="actionPanel" class="action-panel hidden">
      <p id="actionText"></p>
      <button id="btnHit" class="btn btn-primary">补牌</button>
      <button id="btnStand" class="btn btn-secondary">不补牌</button>
    </div>
    <div id="resultPanel" class="result-panel hidden"></div>
    <div id="countdown" class="countdown hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
